name: Build WhatsApp Wallpaper Pro
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WhatsAppWallpaperPro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WhatsAppWallpaperPro-debug-apk
          path: WhatsAppWallpaperPro/app/build/outputs/apk/debug/app-debug.apk
